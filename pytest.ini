[pytest]
# 默认只跑**不依赖外部服务**的用例。
# examples/test_all.py 是会真实调用 LLM 的端到端演示脚本（无密钥/无限流就必然失败），
# 它整体标了 `live` 标记，这里默认排除；本地想跑就显式：pytest -m live
# 这同时绕开了 pytest 8.4+ 的行为变化：未打 marker 的 async 用例从「警告后跳过」
# 变成「直接判失败」，会在 CI 上凭空多出一批红。
addopts = -m "not live"

markers =
    live: 需要真实 LLM API 与网络的端到端用例（CI 不跑，本地用 pytest -m live 运行）

testpaths = examples
