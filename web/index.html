<script>
/* ============================================================
 * MediX 问诊 Demo：原生 JS + fetch 流式（SSE over POST）
 * 后端契约：POST /v1/chat/stream
 *   event: status -> {phase,label,agents,skills,llm_calls,elapsed_ms}
 *   event: delta  -> {text}
 *   event: done   -> {answer,swarm_enabled,client_ttft_ms,answer_ttft_ms,
 *                     total_ms,timings,usage_and_cost,...}
 *   event: error  -> {message}
 * ============================================================ */
const API = {
  chat: '/v1/chat/stream',
  health: '/health',
};

const STAGES = [
  { key: 'received', label: '请求已接收', icon: 'inbox' },
  { key: 'route', label: '任务分解', icon: 'git-branch' },
  { key: 'workers', label: '专家并行执行', icon: 'users' },
  { key: 'synthesize', label: '综合汇总', icon: 'file-text' },
];
const PHASE_INDEX = { received: 0, route: 1, workers: 2, synthesize_pending: 3, synthesize: 3 };

const EXAMPLES = [
  '高血压患者的降压目标值是多少？',
  '2 型糖尿病平时饮食要注意什么？',
  'LDL-C 偏高需要吃他汀吗？',
  '突然剧烈胸痛、冒冷汗，该怎么办？',
];

const state = { sessionId: null, busy: false, controller: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const apiKey = () => localStorage.getItem('medix_api_key') || '';
const headers = () => {
  const h = { 'Content-Type': 'application/json' };
  if (apiKey()) h['X-API-Key'] = apiKey();
  return h;
};

/* ---------------- Markdown（增量渲染 + 保真预处理）---------------- */
// gfm: 表格/删除线等 GFM 语法；breaks: 单个回车按软换行渲染成 <br>
marked.setOptions({ gfm: true, breaks: true });

// 1) 表格保真：marked 的表格是**块级语法**，紧跟在段落后面（只有一个 \n）时
//    往往不被识别，整块表格会被当普通文本 + <br> 渲染 —— 看起来就是「表格被压平」。
//    这里只在**需要时补一个空行**，绝不删除、合并或重写任何既有换行。
function normalizeTables(text) {
  const lines = (text || '').split('\n');
  const tableish = (s) => /\|/.test(s || '');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const cur = lines[i];
    const inTable = tableish(cur);
    const prevIsTable = out.length ? tableish(out[out.length - 1]) : false;
    if (inTable && !prevIsTable && out.length && out[out.length - 1].trim() !== '') {
      out.push('');                                   // 表格块前补空行
    }
    out.push(cur);
    const next = lines[i + 1];
    if (inTable && !tableish(next || '') && (next || '').trim() !== '') {
      out.push('');                                   // 表格块后补空行
    }
  }
  return out.join('\n');
}

// 2) 区间连接符保真：把「数字之间的 ASCII ~」转义成字面量。
//    GFM 的删除线语法是 `~~`，某些模型会把区间写成 `65~~79岁` 而整段被划掉；
//    转义后 `~` 一定按字面渲染。全角 `～` 在 GFM 里没有语义，原样保留即可。
function protectRangeTildes(text) {
  return (text || '').replace(
    /(\d)(\s*)(~{1,2})(\s*)(\d)/g,
    (m, a, s1, t, s2, b) => a + s1 + t.replace(/~/g, '\\~') + s2 + b,
  );
}

const md = (text) => DOMPurify.sanitize(marked.parse(protectRangeTildes(normalizeTables(text || ''))));

/* ---------------- 来源头解析 ---------------- */
const EVIDENCE_RE = /【资料\s*(\d+)\s*[｜|]\s*来源：([^｜|】]+)(?:[｜|]\s*类型：([^】]+))?】/g;

function splitEvidence(raw) {
  const text = raw || '';
  const items = [];
  EVIDENCE_RE.lastIndex = 0;
  let m;
  while ((m = EVIDENCE_RE.exec(text)) !== null) {
    items.push({ idx: m.index, end: m.index + m[0].length, no: m[1], source: m[2].trim(), type: (m[3] || '').trim(), snippet: '' });
  }
  const head = items.length ? text.slice(0, items[0].idx) : text;
  items.forEach((it, i) => {
    const stop = i + 1 < items.length ? items[i + 1].idx : text.length;
    let snip = text.slice(it.end, stop).trim();
    if (snip.length > 420) snip = snip.slice(0, 420) + '…';
    it.snippet = snip;
  });
  return { body: head.trim(), items };
}

/* 兜底：模型常把资料写成《指南名》而不是回显【资料 i】编号来源头。
   这时按《…》提取"文中提及的依据"，并诚实地标注它不是编号来源头。 */
const CITE_RE = /《([^》]{2,60})》/g;

function fallbackSources(body) {
  const out = [];
  const seen = new Set();
  let m;
  CITE_RE.lastIndex = 0;
  while ((m = CITE_RE.exec(body)) !== null) {
    const name = m[1].trim();
    if (seen.has(name)) continue;
    seen.add(name);
    const start = Math.max(0, m.index - 80);
    const end = Math.min(body.length, m.index + m[0].length + 140);
    out.push({ name, snippet: body.slice(start, end).trim() });
    if (out.length >= 6) break;
  }
  return out;
}

/* ---------------- 高危要素识别（红旗横幅的唯一判据）----------------
 * 旧实现只看「答案里有没有 急诊 / 120」：普通指标咨询的答案常含
 * 「若伴胸痛请急诊」这类**转诊提示**，于是误点亮红色急症横幅。
 * 现在报警必须来自**提问或后端**，绝不由答案文本单独触发：
 *   1) 后端信号优先：SSE done.extra.risk_level === 'high'（由 detect_high_risk_signals(提问) 判定）；
 *      后端明确给 'low' 时**绝不误报**；
 *   2) 后端没给信号时兜底：提问命中急危症状词 且 答案确已给出就医指引。
 * 答案关键词只用于「是否已含就医指引」的展示判断，不再单独作为报警依据。
 */
const QUERY_RED_FLAGS = [
  '胸痛', '胸骨后', '心梗', '心肌梗死', '昏迷', '意识不清', '意识模糊',
  '呼吸困难', '喘不上气', '呼吸急促', '窒息', '抽搐', '大出血', '咯血', '呕血',
  '偏瘫', '言语不清', '说不出话', '剧烈头痛', '休克', '晕倒', '猝死', '濒死',
];
const ANSWER_EMERGENCY_HINTS = [
  '立即就医', '拨打 120', '拨打120', '拨打急救', '急救电话', '急诊',
  '急危重症', '尽快就医', '立即就诊', '马上就医',
];
const queryIsHighRisk = (q) => QUERY_RED_FLAGS.some((k) => (q || '').includes(k));
const answerHasEmergency = (t) => ANSWER_EMERGENCY_HINTS.some((k) => (t || '').includes(k));

function shouldShowRiskBanner(done, question, answer) {
  const level = done?.extra?.risk_level ?? done?.risk_level;
  if (level === 'high') return true;                 // 后端权威信号
  if (level === 'low') return false;                 // 后端明确低危 → 绝不误报
  return queryIsHighRisk(question) && answerHasEmergency(answer);   // 兜底：提问高危且已给指引
}

/* ---------------- 渲染工具 ---------------- */
function stageChips(status) {
  const cur = PHASE_INDEX[status?.phase] ?? 0;
  const chips = STAGES.map((s, i) => {
    const done = i < cur, active = i === cur;
    const cls = done
      ? 'border-slate-200 bg-slate-50 text-slate-500'
      : active
        ? 'chip-pulse border-brand/40 bg-brand-soft text-brand'
        : 'border-slate-200 bg-white text-slate-400';
    const icon = done ? 'check' : s.icon;
    return `<span class="inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[11px] ${cls}">
      <i data-lucide="${icon}" class="h-3 w-3"></i>${s.label}</span>`;
  }).join('');
  const meta = [];
  if (status?.agents?.length) meta.push(`Worker：${status.agents.map(prettyAgent).join(' · ')}`);
  if (status?.skills?.length) meta.push(`Skill：${status.skills.join('/')}`);
  if (status?.llm_calls) meta.push(`模型调用 ${status.llm_calls} 次`);
  if (status?.elapsed_ms) meta.push(`${(status.elapsed_ms / 1000).toFixed(1)}s`);
  return `<div class="flex flex-wrap items-center gap-1.5">${chips}</div>
    ${meta.length ? `<p class="mt-1.5 text-[11px] text-slate-400">${esc(meta.join(' · '))}</p>` : ''}`;
}

const AGENT_CN = {
  diagnostic_agent: '诊断专家', consultation_agent: '咨询顾问', research_agent: '研究助手',
  lead_agent: '汇总组长', nutrition_agent: '营养师',
};
const prettyAgent = (a) => AGENT_CN[a] || a;

function evidenceDrawer(items, cites) {
  if (!items.length && !(cites || []).length) return '';
  const card = (title, tag, snippet) => `
    <div class="drawer overflow-hidden rounded-xl border border-slate-200 bg-white">
      <button class="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-slate-50" data-drawer>
        <i data-lucide="book-open" class="h-3.5 w-3.5 shrink-0 text-brand"></i>
        <span class="min-w-0 flex-1 truncate text-xs font-medium text-slate-700">${esc(title)}</span>
        ${tag ? `<span class="shrink-0 rounded-full bg-brand-soft px-2 py-0.5 text-[10px] text-brand">${esc(tag)}</span>` : ''}
        <i data-lucide="chevron-down" class="h-3.5 w-3.5 shrink-0 text-slate-400"></i>
      </button>
      <div class="drawer-body border-t border-slate-100 px-3 py-2">
        <p class="scroll-thin max-h-56 overflow-y-auto whitespace-pre-wrap text-[12px] leading-relaxed text-slate-600">${esc(snippet || '（本片段为空）')}</p>
      </div>
    </div>`;

  let html = '';
  if (items.length) {
    html += `<p class="mb-1.5 flex items-center gap-1 px-1 text-[11px] font-medium text-slate-500">
      <i data-lucide="library" class="h-3 w-3"></i>循证来源（点击展开原文片段）</p>
      <div class="space-y-1.5">${items.map((it) => card(`资料 ${it.no}｜${it.source}`, it.type, it.snippet)).join('')}</div>`;
  }
  if ((cites || []).length) {
    html += `<p class="mb-1.5 mt-2 flex items-center gap-1 px-1 text-[11px] font-medium text-slate-500">
      <i data-lucide="quote" class="h-3 w-3"></i>文中提及的依据
      <span class="font-normal text-slate-400">（本回答未回显编号来源头，以下为正文提到的指南/文献与原文上下文）</span></p>
      <div class="space-y-1.5">${cites.map((c) => card(c.name, '文中提及', c.snippet)).join('')}</div>`;
  }
  return `<div class="mt-2 rounded-xl bg-slate-50 p-2">${html}</div>`;
}

function billTail(done) {
  const u = done?.usage_and_cost || {};
  const ttft = done?.client_ttft_ms != null ? `${(done.client_ttft_ms / 1000).toFixed(1)}s` : '—';
  const tokens = u.total_tokens ? `${(u.total_tokens / 1000).toFixed(1)}k` : '—';
  const cost = u.estimated_cost_cny != null ? `¥${Number(u.estimated_cost_cny).toFixed(4)}` : '—';

  const rows = Object.entries(u.breakdown || {})
    .map(([stage, v]) => `<tr>
        <td class="py-1 pr-3 font-mono text-[11px] text-slate-600">${esc(stage)}</td>
        <td class="py-1 pr-3 text-right">${v.tokens}</td>
        <td class="py-1 pr-3 text-right text-slate-400">${v.prompt_tokens}/${v.completion_tokens}</td>
        <td class="py-1 pr-3 text-right">${v.calls}</td>
        <td class="py-1 text-right">¥${Number(v.cost_cny).toFixed(5)}</td></tr>`).join('');

  const detail = `
    <div class="drawer-body mt-1.5 rounded-lg border border-slate-200 bg-white p-2">
      <table class="w-full text-[10px] text-slate-600">
        <thead><tr class="text-slate-400">
          <th class="py-1 pr-3 text-left font-medium">阶段</th>
          <th class="py-1 pr-3 text-right font-medium">tokens</th>
          <th class="py-1 pr-3 text-right font-medium">输入/出</th>
          <th class="py-1 pr-3 text-right font-medium">次数</th>
          <th class="py-1 text-right font-medium">费用</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="py-1 text-slate-400">无账单明细</td></tr>`}</tbody>
      </table>
      <p class="mt-1.5 text-[10px] text-slate-400">
        模型侧首 token ${done?.answer_ttft_ms != null ? (done.answer_ttft_ms / 1000).toFixed(2) + 's' : '—'}
        · 总耗时 ${done?.total_ms != null ? (done.total_ms / 1000).toFixed(1) + 's' : '—'}
        · 单价 ¥${u.price?.prompt_cny_per_1m ?? '—'}/¥${u.price?.completion_cny_per_1m ?? '—'} 每 1M（输入/输出）
      </p>
    </div>`;

  return `<div class="drawer mt-1.5">
    <button class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[11px] text-slate-400 hover:text-slate-600" data-drawer>
      <span>TTFT ${ttft}</span><span>·</span><span>${tokens} tokens</span><span>·</span><span>${cost}</span>
      <i data-lucide="info" class="h-3 w-3"></i>
    </button>${detail}</div>`;
}

function badge(done) {
  if (done?.swarm_enabled === undefined || done?.swarm_enabled === null) return '';
  const swarm = done.swarm_enabled === true;
  const cls = swarm ? 'bg-violet-50 text-violet-600' : 'bg-slate-100 text-slate-500';
  const label = swarm ? 'Swarm 多专家会诊' : '单 Agent 快速通道';
  const agents = (done.agents_involved || []).map(prettyAgent).join(' · ');
  return `<span class="inline-flex items-center gap-1 rounded-full ${cls} px-2 py-0.5 text-[11px]">
    <i data-lucide="${swarm ? 'network' : 'zap'}" class="h-3 w-3"></i>${label}${agents ? '：' + esc(agents) : ''}</span>`;
}

/* ---------------- 消息渲染 ---------------- */
function addUser(text) {
  const el = document.createElement('div');
  el.className = 'flex justify-end';
  el.innerHTML = `<div class="msg-prose max-w-[85%] rounded-2xl rounded-br-md bg-brand px-4 py-2.5 text-[15px] text-white shadow-sm">${md(text)}</div>`;
  $('chat').appendChild(el);
  scrollDown();
}

function addAssistantShell() {
  const el = document.createElement('div');
  el.className = 'flex gap-2.5';
  el.innerHTML = `
    <div class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-white text-brand shadow-sm ring-1 ring-slate-200">
      <i data-lucide="shield-plus" class="h-4 w-4"></i>
    </div>
    <div class="min-w-0 flex-1">
      <div data-status class="mb-2"></div>
      <div class="rounded-2xl rounded-tl-md bg-white p-3.5 shadow-sm ring-1 ring-slate-200">
        <div data-risk></div>
        <div data-badge class="mb-1.5"></div>
        <div data-body class="msg-prose text-[15px]"></div>
        <div data-evidence></div>
        <div data-bill></div>
      </div>
    </div>`;
  $('chat').appendChild(el);
  return {
    root: el,
    status: el.querySelector('[data-status]'),
    risk: el.querySelector('[data-risk]'),
    badge: el.querySelector('[data-badge]'),
    body: el.querySelector('[data-body]'),
    evidence: el.querySelector('[data-evidence]'),
    bill: el.querySelector('[data-bill]'),
  };
}

function riskBanner() {
  return `<div class="mb-2.5 flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 px-3 py-2.5">
    <i data-lucide="alert-triangle" class="mt-0.5 h-4 w-4 shrink-0 text-red-600"></i>
    <div class="text-[13px] leading-relaxed text-red-800">
      <strong class="font-semibold">急危症状提示：</strong>本回答包含紧急就医建议，请立即前往急诊或拨打 <strong>120</strong>，不要自行观察等待。
    </div></div>`;
}

function errorBox(msg) {
  const hint = /401/.test(msg) ? '<p class="mt-1 text-[11px] text-red-500">后端设置了 APP_API_KEY，请在右上角设置里填入正确的 Key。</p>' : '';
  return `<div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-[13px] text-amber-800">
    <span class="font-medium">请求失败：</span>${esc(msg)}${hint}</div>`;
}

const scrollDown = () => { const c = $('chat'); c.scrollTop = c.scrollHeight; };

/* ---------------- 流式请求 ---------------- */
async function ask(question) {
  if (state.busy || !question.trim()) return;
  state.busy = true;
  $('btn-send').disabled = true;
  $('btn-stop').classList.remove('hidden');
  $('btn-stop').classList.add('flex');

  addUser(question);
  const shell = addAssistantShell();
  shell.body.innerHTML = '<span class="text-slate-400">正在思考…</span>';
  // 提问本身就是急危症状时立刻亮横幅（这是确定性信号，不必等答案）；
  // 后端信号到达后会再判一次，若后端判为 low 会把它撤掉（以权威信号为准）。
  if (queryIsHighRisk(question)) shell.risk.innerHTML = riskBanner();
  let raw = '', lastRender = 0, status = null;

  const paint = (force) => {
    const now = performance.now();
    if (!force && now - lastRender < 60) return;
    lastRender = now;
    const { body } = splitEvidence(raw);
    shell.body.innerHTML = md(body) + '<span class="cursor-blink"></span>';
    scrollDown();
  };

  try {
    state.controller = new AbortController();
    const res = await fetch(API.chat, {
      method: 'POST',
      headers: headers(),
      signal: state.controller.signal,
      body: JSON.stringify({ question, session_id: state.sessionId }),
    });
    if (!res.ok || !res.body) {
      throw new Error(`HTTP ${res.status} ${res.statusText}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const ev = { event: 'message', data: '' };
        frame.split('\n').forEach((line) => {
          if (line.startsWith('event:')) ev.event = line.slice(6).trim();
          else if (line.startsWith('data:')) ev.data += line.slice(5).trim();
        });
        if (!ev.data) continue;
        let payload;
        try { payload = JSON.parse(ev.data); } catch { continue; }

        if (ev.event === 'status') {
          status = payload;
          shell.status.innerHTML = stageChips(status);
          lucide.createIcons();
        } else if (ev.event === 'delta') {
          raw += payload.text || '';
          paint(false);
        } else if (ev.event === 'error') {
          shell.body.innerHTML = errorBox(payload.message || '未知错误');
        } else if (ev.event === 'done') {
          state.sessionId = payload.session_id || state.sessionId;
          raw = payload.answer || raw;
          const { body, items } = splitEvidence(raw);
          // 红旗横幅：以后端 risk_level 为准（其次提问初筛兜底），答案关键词不再单独触发
          shell.risk.innerHTML = shouldShowRiskBanner(payload, question, raw) ? riskBanner() : '';
          shell.body.innerHTML = md(body);
          shell.badge.innerHTML = badge(payload);
          shell.evidence.innerHTML = evidenceDrawer(items, fallbackSources(body));
          shell.bill.innerHTML = billTail(payload);
          if (status) {
            status.phase = 'synthesize';
            status.agents = payload.agents_involved || status.agents;
            delete status.llm_calls;
            shell.status.innerHTML = stageChips(status);
          }
          if (payload.swarm_enabled) payloadFallbackNote(shell);
          lucide.createIcons();
          scrollDown();
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      shell.body.insertAdjacentHTML('beforeend', '<p class="mt-2 text-[12px] text-slate-400">（已停止生成）</p>');
    } else {
      shell.body.innerHTML = errorBox(e.message || String(e));
    }
  } finally {
    state.busy = false;
    $('btn-send').disabled = false;
    $('btn-stop').classList.add('hidden');
    $('btn-stop').classList.remove('flex');
    lucide.createIcons();
  }
}

function payloadFallbackNote(shell) {
  shell.body.insertAdjacentHTML('beforeend',
    '<p class="mt-3 border-t border-slate-100 pt-2 text-[11px] text-slate-400">' +
    '答案由多 Agent 协作生成：诊断专家评估风险 · 咨询顾问给建议 · 汇总组长统稿；' +
    '出口经过安全网校验（缺就医提醒或免责声明会自动补齐）。</p>');
}

/* ---------------- 交互绑定 ---------------- */
function renderExamples() {
  $('examples').innerHTML = EXAMPLES.map((q) =>
    `<button class="rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[11px] text-slate-600 hover:border-brand/40 hover:text-brand" data-example>${esc(q)}</button>`).join('');
}

async function checkHealth() {
  try {
    const r = await fetch(API.health);
    const ok = r.ok;
    $('health-dot').className = `h-2 w-2 rounded-full ${ok ? 'bg-safe' : 'bg-red-500'}`;
    $('health-text').textContent = ok ? '服务正常' : '服务异常';
  } catch {
    $('health-dot').className = 'h-2 w-2 rounded-full bg-red-500';
    $('health-text').textContent = '未连接';
  }
}

document.addEventListener('click', (e) => {
  const ex = e.target.closest('[data-example]');
  if (ex) { $('input').value = ex.textContent; autoGrow(); $('input').focus(); return; }

  const drawerBtn = e.target.closest('[data-drawer]');
  if (drawerBtn) {
    const d = drawerBtn.closest('.drawer');
    d.classList.toggle('open');
    const ic = drawerBtn.querySelector('[data-lucide="chevron-down"], [data-lucide="chevron-up"]');
    if (ic) ic.setAttribute('data-lucide', d.classList.contains('open') ? 'chevron-up' : 'chevron-down');
    lucide.createIcons();
  }
});

function autoGrow() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 128) + 'px';
}

$('input').addEventListener('input', autoGrow);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    const q = $('input').value;
    $('input').value = '';
    autoGrow();
    ask(q);
  }
});
$('btn-send').addEventListener('click', () => {
  const q = $('input').value;
  $('input').value = '';
  autoGrow();
  ask(q);
});
$('btn-stop').addEventListener('click', () => state.controller?.abort());
$('btn-settings').addEventListener('click', () => $('settings').classList.toggle('hidden'));
$('btn-save-key').addEventListener('click', () => {
  localStorage.setItem('medix_api_key', $('input-apikey').value.trim());
  $('settings').classList.add('hidden');
  checkHealth();
});
$('btn-new-session').addEventListener('click', () => {
  state.sessionId = null;
  $('chat').innerHTML = welcome();
  lucide.createIcons();
  $('settings').classList.add('hidden');
});

function welcome() {
  return `<div class="rounded-2xl bg-white p-6 text-center shadow-sm ring-1 ring-slate-200">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-soft text-brand">
      <i data-lucide="messages-square" class="h-6 w-6"></i>
    </div>
    <h2 class="mt-3 text-base font-semibold">说说你的情况，我来帮你梳理</h2>
    <p class="mx-auto mt-1.5 max-w-md text-[13px] leading-relaxed text-slate-500">
      我基于国家级指南做健康科普与分诊参考，回答会标注来源；涉及用药剂量与确诊会明确提示就医。
      试试下面这些问题，或直接描述症状。
    </p></div>`;
}

/* ---------------- 启动 ---------------- */
$('input-apikey').value = apiKey();
renderExamples();
$('chat').innerHTML = welcome();
lucide.createIcons();
checkHealth();
autoGrow();
</script>
</body>
</html>
